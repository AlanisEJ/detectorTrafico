[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sit-detector-trafico"
version = "0.2.0"
description = "Captura, seguimiento y eventos de tráfico para el SIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata==2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
vision = [
  "numpy==2.2.6",
  "opencv-python==4.12.0.88",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "ultralytics==8.3.221",
  "lap==0.5.12",
]

[project.scripts]
sit = "sit.main:main"

[tool.setuptools.packages.find]
where = ["src"]
